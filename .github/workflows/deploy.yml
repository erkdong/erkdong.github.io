name: Deploy to GitHub Pages
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Cache the Playwright browser so only the first run pays the download.
      # Keyed on the lockfile, so a dependency change re-pulls it.
      - name: Cache Playwright browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      # Install only the headless shell — the exact binary headless
      # chromium.launch() uses in scripts/prerender.js — not the full Chrome.
      # The ubuntu runner already ships the system libs (--with-deps unneeded).
      - name: Install Playwright Chromium (for prerendering)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium-headless-shell

      - name: Build project
        run: npm run build

      - name: Copy index.html to 404.html
        run: cp dist/index.html dist/404.html

      - name: Add CNAME file
        run: echo 'erkdong.com' > dist/CNAME

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
